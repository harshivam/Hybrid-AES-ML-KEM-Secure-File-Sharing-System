# ===================================================================
# Hybrid AES-ML-KEM Secure File Sharing System Configuration
# ===================================================================

server.port=8080

# -------------------------------------------------------------------
# File Upload Limits
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# -------------------------------------------------------------------
# Local Encrypted File Storage Location
# -------------------------------------------------------------------
file.storage.location=./storage/encrypted

# -------------------------------------------------------------------
# DATABASE CONFIGURATION: H2 (Default for rapid local testing)
# -------------------------------------------------------------------
# In-memory H2 database runs immediately with zero external setup
spring.datasource.url=jdbc:h2:mem:filesharedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

